[project]
name = "pdf-search"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["click>=8.4.1", "flask>=3.1.3"]

[dependency-groups]
dev = [
  "flake8>=7.3.0",
  "flake8-pyproject>=1.2.4",
  "isort>=8.0.1",
  "ruff>=0.15.18",
  "ty>=0.0.51",
]

[project.scripts]
pdf-search = "pdf_search.main:main"

[build-system]
requires = ["uv_build>=0.11.23,<0.12"]
build-backend = "uv_build"

[tool.flake8]
max-line-length = 100

[tool.isort]
known_local_folder = ["pdf_search"]
line_length = 100

[tool.ruff]
line-length = 100
